<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat với WebSocket (Rooms)</title>
  </head>
  <body>
    <h2>Chat với WebSocket (Rooms)</h2>
    <label>Nhập tên:</label>
    <input type="text" id="username" placeholder="Tên của bạn" />

    <label>Chọn phòng:</label>
    <select id="room">
      <option value="room1">Room 1</option>
      <option value="room2">Room 2</option>
    </select>
    <button onclick="joinRoom()">Vào phòng</button>

    <h3>Người đang online:</h3>
    <ul id="online-users"></ul>

    <div id="chatbox"></div>
    <input type="text" id="message" placeholder="Nhập tin nhắn..." disabled />
    <button onclick="sendMessage()" disabled>Gửi</button>

    <script>
      let ws, currentRoom, username;

      function joinRoom() {
        username = document.getElementById("username").value;
        currentRoom = document.getElementById("room").value;

        if (!username) {
          alert("Vui lòng nhập tên!");
          return;
        }

        ws = new WebSocket("ws://localhost:3000");

        ws.onopen = () => {
          ws.send(
            JSON.stringify({ type: "join", room: currentRoom, username })
          );
          document.getElementById("message").disabled = false;
          document.querySelector(
            "button[onclick='sendMessage()']"
          ).disabled = false;
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          const chatbox = document.getElementById("chatbox");
          const onlineUsersList = document.getElementById("online-users");

          if (data.type === "history") {
            chatbox.innerHTML = "";
            data.messages.forEach((msg) => {
              chatbox.innerHTML += `<p><b>${msg.username}:</b> ${msg.message}</p>`;
            });
          } else if (data.type === "message") {
            chatbox.innerHTML += `<p><b>${data.username}:</b> ${data.message}</p>`;
          } else if (data.type === "usersOnline") {
            onlineUsersList.innerHTML = data.users
              .map((user) => `<li>${user}</li>`)
              .join("");
          }
        };
      }

      function sendMessage() {
        const messageInput = document.getElementById("message");
        const message = messageInput.value;

        if (ws && message) {
          ws.send(
            JSON.stringify({
              type: "message",
              room: currentRoom,
              username,
              message,
            })
          );
          messageInput.value = "";
        }
      }
    </script>
  </body>
</html>
